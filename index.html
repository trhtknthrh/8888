<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WhatsApp Web</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    if (!window.supabase) {
      document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
    }
  </script>
  <style>
    :root {
      --bg-app: #efeae2;
      --bg-outer: #d1d7db;
      --bg-panel: #ffffff;
      --bg-panel-secondary: #f0f2f5;
      --bg-hover: #f5f6f6;
      --bg-active: #ebebeb;
      --bg-bubble-out: #d9fdd3;
      --bg-bubble-in: #ffffff;
      --bg-quote: rgba(0, 0, 0, 0.05);
      --bg-input: #ffffff;
      --bg-modal: #ffffff;
      --bg-toast: #111b21;
      --text-primary: #111b21;
      --text-secondary: #54656f;
      --text-muted: #667781;
      --text-toast: #ffffff;
      --border-color: #e9edef;
      --border-strong: #d1d7db;
      --accent: #00a884;
      --accent-dark: #008069;
      --accent-light: #e7fce3;
      --tick-grey: #8696a0;
      --tick-blue: #53bdeb;
      --danger: #ea0038;
      --warning: #f59e0b;
      --shadow-sm: 0 1px 2px rgba(11, 20, 26, 0.08);
      --shadow-md: 0 4px 16px rgba(11, 20, 26, 0.14);
      --shadow-lg: 0 12px 32px rgba(11, 20, 26, 0.22);
      --msg-font-size: 14.5px;
      --chat-pattern-opacity: 0.06;
    }

    [data-theme="dark"] {
      --bg-app: #0b141a;
      --bg-outer: #090e11;
      --bg-panel: #111b21;
      --bg-panel-secondary: #202c33;
      --bg-hover: #202c33;
      --bg-active: #2a3942;
      --bg-bubble-out: #005c4b;
      --bg-bubble-in: #202c33;
      --bg-quote: rgba(0, 0, 0, 0.24);
      --bg-input: #2a3942;
      --bg-modal: #233138;
      --bg-toast: #202c33;
      --text-primary: #e9edef;
      --text-secondary: #8696a0;
      --text-muted: #8696a0;
      --text-toast: #e9edef;
      --border-color: #222d34;
      --border-strong: #2f3b43;
      --accent: #00a884;
      --accent-dark: #06cf9c;
      --accent-light: rgba(0, 168, 132, 0.16);
      --tick-grey: #8696a0;
      --tick-blue: #53bdeb;
      --danger: #f15c6d;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 14px 36px rgba(0, 0, 0, 0.6);
      --chat-pattern-opacity: 0.04;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-outer);
      color: var(--text-primary);
      overflow: hidden;
      direction: rtl;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: transparent;
      transition: background-color 0.16s ease, transform 0.1s ease, opacity 0.16s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(134, 150, 160, 0.35);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(134, 150, 160, 0.55);
    }

    .hidden {
      display: none !important;
    }

    .top-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 128px;
      background: linear-gradient(135deg, #00a884 0%, #008069 100%);
      z-index: 0;
    }
    [data-theme="dark"] .top-backdrop {
      background: #090e11;
    }

    /* ================= SYSTEM LOCK / BAN OVERLAY ================= */
    .system-lock-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(11, 20, 26, 0.97);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #ffffff;
      text-align: center;
    }

    .system-lock-card {
      background: #1f2c34;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      animation: fadeSlideUp 0.28s ease;
    }

    /* ================= AUTH / ONBOARDING SCREEN ================= */
    .auth-wrapper {
      position: relative;
      z-index: 10;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .auth-card {
      background: var(--bg-panel);
      width: 100%;
      max-width: 500px;
      border-radius: 18px;
      box-shadow: var(--shadow-lg);
      padding: 28px 32px;
      animation: fadeSlideUp 0.35s ease;
      max-height: 95vh;
      overflow-y: auto;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .auth-brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #00a884, #008069);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 4px 12px rgba(0, 168, 132, 0.32);
    }

    .auth-brand h1 {
      font-size: 21px;
      font-weight: 700;
    }

    .auth-brand p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .auth-mode-tabs {
      display: flex;
      background: var(--bg-panel-secondary);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 20px;
      gap: 4px;
    }

    .auth-mode-tab {
      flex: 1;
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .auth-mode-tab.active {
      background: var(--bg-panel);
      color: var(--accent);
      box-shadow: var(--shadow-sm);
    }

    .avatar-upload-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .avatar-preview-lg {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      position: relative;
      overflow: hidden;
      border: 3px solid var(--accent);
      box-shadow: var(--shadow-md);
      cursor: pointer;
    }

    .avatar-preview-lg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-upload-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      opacity: 0;
      transition: opacity 0.2s;
      gap: 4px;
    }

    .avatar-preview-lg:hover .avatar-upload-overlay {
      opacity: 1;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border-strong);
      background: var(--bg-panel-secondary);
      font-size: 14.5px;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent);
      background: var(--bg-panel);
    }

    .color-swatches {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .color-swatch.selected {
      transform: scale(1.16);
      border-color: var(--text-primary);
      box-shadow: 0 0 0 2px var(--bg-panel) inset;
    }

    .btn-primary {
      width: 100%;
      padding: 12px 18px;
      border-radius: 11px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(0, 168, 132, 0.28);
    }

    .btn-primary:hover {
      background: var(--accent-dark);
    }

    .btn-secondary {
      padding: 9px 15px;
      border-radius: 9px;
      background: var(--bg-panel-secondary);
      color: var(--text-primary);
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary:hover {
      background: var(--bg-active);
    }

    .btn-danger {
      padding: 9px 15px;
      border-radius: 9px;
      background: var(--danger);
      color: #fff;
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .existing-user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-panel-secondary);
      text-align: right;
    }

    .existing-user-item:hover {
      border-color: var(--accent);
      background: var(--bg-hover);
    }

    .auth-error {
      color: var(--danger);
      font-size: 13px;
      margin-bottom: 10px;
      font-weight: 600;
      background: rgba(234, 0, 56, 0.08);
      padding: 8px 12px;
      border-radius: 8px;
    }

    /* ================= MAIN APP SHELL ================= */
    .app-shell {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      max-width: 1640px;
      margin: 0 auto;
      display: flex;
      background: var(--bg-panel);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    @media (min-width: 1440px) {
      .app-shell {
        top: 18px;
        height: calc(100% - 36px);
        border-radius: 12px;
      }
    }

    /* ================= SIDEBAR ================= */
    .sidebar {
      width: 390px;
      min-width: 330px;
      max-width: 440px;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border-color);
      background: var(--bg-panel);
      position: relative;
      z-index: 4;
    }

    .sidebar-header {
      height: 62px;
      padding: 10px 16px;
      background: var(--bg-panel-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .current-user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 10px;
    }

    .current-user-pill:hover {
      background: var(--bg-hover);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      position: relative;
    }

    .icon-btn:hover {
      background: var(--bg-active);
      color: var(--text-primary);
    }

    .icon-btn.active {
      background: var(--accent-light);
      color: var(--accent);
    }

    /* Avatars & Online Dot */
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
      position: relative;
      background-size: cover;
      background-position: center;
      user-select: none;
    }

    .avatar.sm { width: 34px; height: 34px; font-size: 13px; }
    .avatar.lg { width: 52px; height: 52px; font-size: 19px; }
    .avatar.xl { width: 110px; height: 110px; font-size: 40px; }

    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .online-dot {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #25d366;
      border: 2px solid var(--bg-panel);
    }

    /* Search & Filter Bar */
    .search-section {
      padding: 8px 12px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .search-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-panel-secondary);
      padding: 7px 12px;
      border-radius: 10px;
    }

    .search-input-wrap input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 14px;
    }

    .filter-chips {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .chip {
      padding: 5px 11px;
      border-radius: 16px;
      font-size: 12.5px;
      font-weight: 600;
      background: var(--bg-panel-secondary);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .chip.active {
      background: var(--accent-light);
      color: var(--accent-dark);
    }

    /* Two Main Tabs: Users & Chats */
    .main-tabs {
      display: flex;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .main-tab {
      flex: 1;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-secondary);
      border-bottom: 3px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .main-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 700;
    }

    /* Sidebar List */
    .sidebar-list {
      flex: 1;
      overflow-y: auto;
    }

    .list-section-title {
      padding: 10px 16px 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      background: var(--bg-panel-secondary);
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background-color 0.14s;
      position: relative;
    }

    .list-item:hover {
      background: var(--bg-hover);
    }

    .list-item.active {
      background: var(--bg-active);
    }

    .list-item-body {
      flex: 1;
      min-width: 0;
    }

    .list-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 3px;
    }

    .list-item-title {
      font-size: 15.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .list-item-time {
      font-size: 11.5px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .list-item-time.unread {
      color: var(--accent);
      font-weight: 700;
    }

    .list-item-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .list-item-subtitle {
      font-size: 13.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .typing-text {
      color: var(--accent) !important;
      font-weight: 600;
    }

    .unread-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11.5px;
      font-weight: 700;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .empty-state {
      padding: 40px 24px;
      text-align: center;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* ================= CHAT AREA ================= */
    .chat-pane {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg-app);
      position: relative;
      min-width: 0;
    }

    .chat-wallpaper {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: var(--chat-pattern-opacity);
      background-image: radial-gradient(var(--text-primary) 1px, transparent 1px), radial-gradient(var(--text-primary) 1px, var(--bg-app) 1px);
      background-size: 36px 36px;
      background-position: 0 0, 18px 18px;
    }

    .welcome-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      z-index: 1;
      background: var(--bg-panel-secondary);
      border-bottom: 6px solid var(--accent);
    }

    .welcome-screen h2 {
      font-size: 26px;
      font-weight: 400;
      margin: 18px 0 10px;
    }

    .welcome-screen p {
      max-width: 460px;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Chat Header */
    .chat-header {
      height: 62px;
      padding: 8px 16px;
      background: var(--bg-panel-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 3;
      flex-shrink: 0;
    }

    .chat-header-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .chat-header-text {
      min-width: 0;
    }

    .chat-header-title {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-header-status {
      font-size: 12.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* In-Chat Search Bar */
    .in-chat-search {
      background: var(--bg-panel);
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 3;
    }

    .in-chat-search input {
      flex: 1;
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg-panel-secondary);
      outline: none;
      font-size: 13.5px;
    }

    /* Pinned Banner */
    .pinned-banner {
      background: var(--bg-panel);
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 2;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .pinned-banner-content {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 13px;
    }

    /* Messages Stream */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 5%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 1;
      scroll-behavior: smooth;
    }

    .date-divider {
      align-self: center;
      background: var(--bg-panel);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 8px;
      margin: 10px 0;
      box-shadow: var(--shadow-sm);
    }

    .system-msg {
      align-self: center;
      background: var(--bg-panel);
      color: var(--text-secondary);
      font-size: 12.5px;
      padding: 6px 14px;
      border-radius: 9px;
      margin: 6px 0;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }

    .admin-console-card {
      align-self: center;
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-right: 4px solid var(--accent);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 8px 0;
      max-width: 95%;
      width: 610px;
      box-shadow: var(--shadow-md);
      font-size: 13.5px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    /* Admin Interactive Controls inside Special Message */
    .admin-inline-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
      white-space: normal;
    }

    .admin-inline-input {
      flex: 1;
      min-width: 130px;
      padding: 7px 11px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg-panel-secondary);
      font-size: 13px;
      outline: none;
      transition: border-color 0.16s ease, background-color 0.16s ease;
    }

    .admin-inline-input:focus {
      border-color: var(--accent);
      background: var(--bg-panel);
    }

    .admin-inline-submit {
      padding: 7px 14px;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .admin-inline-submit:hover {
      background: var(--accent-dark);
    }

    .admin-inline-error {
      color: var(--danger);
      font-size: 12px;
      font-weight: 600;
      margin-top: 6px;
      white-space: normal;
    }

    .admin-cmd-section {
      margin-top: 10px;
      white-space: normal;
    }

    .admin-cmd-section:first-child {
      margin-top: 2px;
    }

    .admin-cmd-section-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }

    .admin-cmd-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .admin-cmd-btn {
      padding: 6px 11px;
      border-radius: 8px;
      background: var(--bg-panel-secondary);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-align: right;
    }

    .admin-cmd-btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent);
      color: var(--accent-dark);
    }

    .admin-cmd-btn.active {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent-dark);
      font-weight: 600;
    }

    .admin-cmd-param-box {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 9px;
      background: var(--bg-panel-secondary);
      border: 1px solid var(--border-color);
      white-space: normal;
    }

    .admin-cmd-param-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 78%;
      position: relative;
      margin-bottom: 2px;
    }

    .msg-row.outgoing {
      align-self: flex-start;
      flex-direction: row;
    }

    .msg-row.incoming {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-row.highlight .msg-bubble {
      box-shadow: 0 0 0 2.5px var(--accent);
    }

    .msg-select-checkbox {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
      align-self: center;
      flex-shrink: 0;
    }

    .msg-bubble {
      padding: 7px 11px 6px;
      border-radius: 10px;
      box-shadow: var(--shadow-sm);
      position: relative;
      min-width: 96px;
      max-width: 100%;
      word-wrap: break-word;
      font-size: var(--msg-font-size);
      line-height: 1.44;
    }

    .msg-row.outgoing .msg-bubble {
      background: var(--bg-bubble-out);
      border-top-right-radius: 2px;
    }

    .msg-row.incoming .msg-bubble {
      background: var(--bg-bubble-in);
      border-top-left-radius: 2px;
    }

    .msg-menu-trigger {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(128, 128, 128, 0.14);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .msg-bubble:hover .msg-menu-trigger,
    .msg-menu-trigger:focus {
      opacity: 1;
    }

    @media (max-width: 768px) {
      .msg-row { max-width: 88%; }
      .msg-menu-trigger { opacity: 0.75; }
    }

    .msg-sender-name {
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .msg-forwarded-tag {
      font-size: 11.5px;
      font-style: italic;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 3px;
    }

    .msg-quote-box {
      background: var(--bg-quote);
      border-right: 3.5px solid var(--accent);
      border-radius: 6px;
      padding: 5px 9px;
      margin-bottom: 5px;
      font-size: 12.5px;
      cursor: pointer;
    }

    .msg-quote-author {
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 2px;
    }

    .msg-quote-text {
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    .msg-deleted-text {
      font-style: italic;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msg-text a {
      color: #027eb5;
      text-decoration: underline;
    }
    [data-theme="dark"] .msg-text a {
      color: #53bdeb;
    }

    .mention-tag {
      color: #027eb5;
      font-weight: 700;
      background: rgba(2, 126, 181, 0.1);
      padding: 0 4px;
      border-radius: 4px;
    }
    [data-theme="dark"] .mention-tag {
      color: #53bdeb;
      background: rgba(83, 189, 235, 0.14);
    }

    /* Poll Card inside Message */
    .poll-card {
      min-width: 240px;
      max-width: 310px;
      padding: 4px 2px;
    }

    .poll-question {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .poll-option-btn {
      width: 100%;
      text-align: right;
      background: var(--bg-quote);
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      padding: 8px 10px;
      margin-bottom: 6px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .poll-option-btn.voted {
      border-color: var(--accent);
    }

    .poll-option-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      font-weight: 600;
      z-index: 1;
    }

    .poll-bar-bg {
      height: 6px;
      background: rgba(134, 150, 160, 0.2);
      border-radius: 4px;
      overflow: hidden;
      width: 100%;
    }

    .poll-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.25s ease;
    }

    .link-preview-card {
      margin-top: 6px;
      background: var(--bg-quote);
      border-radius: 8px;
      padding: 8px 10px;
      border-right: 3px solid #027eb5;
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .link-preview-domain {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
    }

    .link-preview-url {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .msg-image {
      max-width: 280px;
      max-height: 280px;
      width: 100%;
      border-radius: 8px;
      display: block;
      margin-bottom: 4px;
      cursor: pointer;
      object-fit: cover;
    }

    .msg-file-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-quote);
      padding: 9px 12px;
      border-radius: 8px;
      margin-bottom: 4px;
      min-width: 210px;
    }

    .msg-file-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 11px;
      flex-shrink: 0;
    }

    .voice-player {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 225px;
      padding: 4px 2px;
    }

    .voice-play-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .voice-track {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .voice-progress {
      width: 100%;
      accent-color: var(--accent);
      height: 4px;
      cursor: pointer;
    }

    .voice-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .voice-speed-btn {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      background: var(--bg-quote);
      color: var(--text-secondary);
    }

    .msg-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 2px;
      font-size: 11px;
      color: var(--text-muted);
      float: left;
      margin-right: 8px;
    }

    .tick-icon {
      display: inline-flex;
      align-items: center;
      color: var(--tick-grey);
    }

    .tick-icon.read {
      color: var(--tick-blue);
    }

    .msg-reactions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
      clear: both;
    }

    .reaction-pill {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1px 7px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      box-shadow: var(--shadow-sm);
    }

    .reaction-pill.mine {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .scroll-bottom-btn {
      position: absolute;
      bottom: 78px;
      left: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-panel);
      color: var(--text-secondary);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
